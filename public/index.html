<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="NDZ Bot Generator - Buat bot otomatis dengan memilih case yang diinginkan."
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <title>NDZ Bot Generator</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <main class="container">

        <!-- HEADER -->
        <header class="hero">
            <div class="brand">
                ⚡ NDZ BOT GENERATOR
            </div>

            <h1>
                Create Bot
                <span>Otomatis</span>
            </h1>

            <p>
                Buat bot secara otomatis dengan memilih
                case yang ingin dimasukkan ke dalam bot baru.
            </p>
        </header>


        <!-- FORM -->
        <section class="panel">

            <!-- INFORMASI BOT -->
            <div class="grid">

                <label>
                    Nama Bot
                    <input
                        type="text"
                        id="name"
                        placeholder="DIN BOT"
                        autocomplete="off"
                    >
                </label>

                <label>
                    Nama Pembuat
                    <input
                        type="text"
                        id="author"
                        placeholder="DIN STORE"
                        autocomplete="off"
                    >
                </label>

                <label>
                    Kategori
                    <select id="category">
                        <option value="WhatsApp Bot">
                            WhatsApp Bot
                        </option>

                        <option value="Store Bot">
                            Store Bot
                        </option>

                        <option value="Utility">
                            Utility
                        </option>

                        <option value="Downloader">
                            Downloader
                        </option>

                        <option value="AI">
                            AI
                        </option>
                    </select>
                </label>

                <label>
                    Prefix
                    <input
                        type="text"
                        id="prefix"
                        value="."
                        maxlength="5"
                        autocomplete="off"
                    >
                </label>

            </div>


            <!-- SEARCH & CONTROL -->
            <div class="bar">

                <input
                    type="search"
                    id="search"
                    placeholder="🔎 Cari case..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="all"
                >
                    ☑ Pilih Semua
                </button>

                <button
                    type="button"
                    id="none"
                >
                    ☐ Kosongkan
                </button>

            </div>


            <!-- CASE LIST -->
            <div
                id="cases"
                class="cases"
            >
                <!-- Case akan dimuat otomatis dari case.json -->
            </div>


            <!-- CREATE -->
            <button
                type="button"
                id="create"
            >
                🚀 CREATE BOT & DOWNLOAD
            </button>


            <!-- STATUS -->
            <p
                id="status"
                role="status"
                aria-live="polite"
            ></p>

        </section>

    </main>


    <script src="/script.js"></script>

</body>
</html>
